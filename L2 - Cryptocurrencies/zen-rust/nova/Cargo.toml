[package]
name = "nova"
version = "0.1.0"
edition = "2021"

[dependencies]
nova-snark = { version = "0.76.0", features = ["test-utils"] }
ff = { version = "0.13", features = ["derive"] }
generic-array = "1.2"
bincode = { version = "2", features = ["serde"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
pasta = []
