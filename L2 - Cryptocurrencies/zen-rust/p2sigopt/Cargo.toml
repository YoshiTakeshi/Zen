[package]
name = "p2sigopt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
num-bigint = "0.4"
plonky2 = "1.1"
rand = "0.8"
ark-bn254 = "0.5"
ark-ff = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
