# Builds the Zen image for linux/amd64 and linux/arm64 and publishes it to the GitHub container registry on every tag (v*) and on main.
# Pull and run:  docker run -d -p 127.0.0.1:18440-18462:18440-18462 -v zen-data:/data ghcr.io/<owner>/zen:latest
name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  image:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with: { images: "ghcr.io/${{ github.repository_owner }}/zen", tags: "type=ref,event=branch\ntype=semver,pattern={{version}}\ntype=raw,value=latest,enable={{is_default_branch}}" }
      - uses: docker/build-push-action@v6
        with:
          context: zenproof
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
