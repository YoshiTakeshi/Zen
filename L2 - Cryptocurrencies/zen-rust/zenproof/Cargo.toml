[package]
name = "zenproof"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
num-bigint = "0.4"
plonky2 = "1.1"
rand = "0.8"
ark-bn254 = "0.5"
ark-ff = { version = "0.5", features = ["asm"] }
ark-ec = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
